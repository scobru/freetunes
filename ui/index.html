<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111216" />
  <title>FreeTunes</title>
</head>
<body>
  <div class="banner">Experiment: unfinished, may lose data. Publish only music you have the right to publish.</div>
  <header class="top">
    <div class="top-brand">
      <a class="logo" href="#/" aria-label="FreeTunes home">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <circle cx="16" cy="16" r="15" fill="#15171e" stroke="url(#g)" stroke-width="2"/>
          <circle cx="16" cy="16" r="10" fill="none" stroke="#252b37" stroke-width="1"/>
          <circle cx="16" cy="16" r="6.5" fill="none" stroke="#252b37" stroke-width="1"/>
          <circle cx="16" cy="16" r="3.2" fill="url(#g)"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1da0c3"/><stop offset="1" stop-color="#46c4d3"/></linearGradient></defs>
        </svg>
        <span>FreeTunes</span>
      </a>
    </div>
    <div class="top-search">
      <form id="header-search-form" role="search" onsubmit="event.preventDefault();">
        <svg class="search-ic" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z" fill="currentColor"/>
        </svg>
        <input id="header-search-input" type="search" placeholder="Search artists, tracks, or albums..." autocomplete="off" />
      </form>
      <div id="search-quick-results" class="search-quick-results" hidden></div>
    </div>
    <nav>
      <a href="#/" data-nav="explore">Explore</a>
      <a href="#/artists" data-nav="artists">Artists</a>
      <a href="#/identity" data-nav="identity">Identity</a>
      <a class="btn primary small" href="#/publish" data-nav="publish">Publish</a>
    </nav>
  </header>
  <main id="app"></main>
  <footer>
    <p>Everything published here is <b>public and permanent</b>. FreeTunes is an experiment.</p>
    <p>
      <a href="https://github.com/scobru/freetunes" target="_blank" rel="noopener noreferrer">github.com/scobru/freetunes</a> &middot; MIT &middot;
      Made with &#9829; by <a href="https://scobrudot.dev" target="_blank" rel="noopener noreferrer">scobru</a> &middot;
      <a href="#/admin">Moderation</a>
    </p>
  </footer>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
